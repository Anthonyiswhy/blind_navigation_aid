<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">

  <!-- Background -->
  <rect width="900" height="620" fill="#0d1117"/>

  <!-- ── THREAD LABEL ── -->
  <text x="30" y="28" fill="#8b949e" font-size="11" letter-spacing="1">CAPTURE THREAD  (daemon)</text>
  <rect x="20" y="36" width="860" height="76" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- RealSense D435 -->
  <rect x="36" y="50" width="160" height="50" rx="6" fill="#0e4429" stroke="#26a641" stroke-width="1"/>
  <text x="116" y="72" fill="#3fb950" font-weight="bold" text-anchor="middle">RealSense D435</text>
  <text x="116" y="90" fill="#8b949e" font-size="11" text-anchor="middle">depth + color 640×480</text>

  <!-- arrow -->
  <line x1="196" y1="75" x2="234" y2="75" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>
  <text x="215" y="69" fill="#8b949e" font-size="10" text-anchor="middle">30fps</text>

  <!-- align.process -->
  <rect x="234" y="50" width="160" height="50" rx="6" fill="#0e4429" stroke="#26a641" stroke-width="1"/>
  <text x="314" y="72" fill="#3fb950" font-weight="bold" text-anchor="middle">align.process()</text>
  <text x="314" y="90" fill="#8b949e" font-size="11" text-anchor="middle">depth → color space</text>

  <!-- arrow -->
  <line x1="394" y1="75" x2="432" y2="75" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>
  <text x="413" y="69" fill="#8b949e" font-size="10" text-anchor="middle">aligned</text>

  <!-- queue.Queue -->
  <rect x="432" y="50" width="180" height="50" rx="6" fill="#1a1160" stroke="#7c3aed" stroke-width="1"/>
  <text x="522" y="72" fill="#a78bfa" font-weight="bold" text-anchor="middle">queue.Queue</text>
  <text x="522" y="90" fill="#8b949e" font-size="11" text-anchor="middle">maxsize=2 · drop stale</text>

  <!-- arrow down to main loop -->
  <line x1="522" y1="100" x2="522" y2="136" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>
  <text x="548" y="122" fill="#8b949e" font-size="11">get(timeout=2s)</text>

  <!-- ── MAIN LOOP ── -->
  <text x="30" y="158" fill="#8b949e" font-size="11" letter-spacing="1">MAIN LOOP</text>

  <!-- letterbox -->
  <rect x="36" y="166" width="150" height="50" rx="6" fill="#0a3040" stroke="#1f6feb" stroke-width="1"/>
  <text x="111" y="188" fill="#58a6ff" font-weight="bold" text-anchor="middle">letterbox_resize</text>
  <text x="111" y="205" fill="#8b949e" font-size="11" text-anchor="middle">640×480 → 224×224</text>

  <line x1="186" y1="191" x2="224" y2="191" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- YOLO26n -->
  <rect x="224" y="166" width="160" height="50" rx="6" fill="#1a1160" stroke="#7c3aed" stroke-width="1"/>
  <text x="304" y="184" fill="#a78bfa" font-weight="bold" text-anchor="middle">YOLO26n ONNX</text>
  <text x="304" y="200" fill="#8b949e" font-size="11" text-anchor="middle">4 threads · ~40ms</text>
  <text x="304" y="213" fill="#8b949e" font-size="10" text-anchor="middle">output (1, 300, 6)</text>

  <line x1="384" y1="191" x2="422" y2="191" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- postprocess -->
  <rect x="422" y="166" width="160" height="50" rx="6" fill="#1a1160" stroke="#7c3aed" stroke-width="1"/>
  <text x="502" y="184" fill="#a78bfa" font-weight="bold" text-anchor="middle">yolo_postprocess</text>
  <text x="502" y="200" fill="#8b949e" font-size="11" text-anchor="middle">conf≥0.38 · box≥10px</text>
  <text x="502" y="213" fill="#8b949e" font-size="10" text-anchor="middle">IGNORED_CLASSES filtered</text>

  <line x1="582" y1="191" x2="620" y2="191" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- ObjectTracker -->
  <rect x="620" y="166" width="260" height="50" rx="6" fill="#271d00" stroke="#d29922" stroke-width="1"/>
  <text x="750" y="184" fill="#e3b341" font-weight="bold" text-anchor="middle">ObjectTracker  (IoU match)</text>
  <text x="750" y="200" fill="#8b949e" font-size="11" text-anchor="middle">max_age=1s · EMA bbox α=0.6</text>
  <text x="750" y="213" fill="#8b949e" font-size="10" text-anchor="middle">ghost filter: seen_frames ≥ 3</text>

  <!-- arrow from queue into letterbox -->
  <line x1="434" y1="100" x2="111" y2="100" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="111" y1="100" x2="111" y2="164" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- ── DEPTH + EGO ROW ── -->
  <text x="30" y="250" fill="#8b949e" font-size="11" letter-spacing="1">DEPTH + EGO-MOTION  (every frame)</text>

  <!-- get_smart_distance -->
  <rect x="36" y="258" width="220" height="64" rx="6" fill="#0a3040" stroke="#1f6feb" stroke-width="1"/>
  <text x="146" y="276" fill="#58a6ff" font-weight="bold" text-anchor="middle">get_smart_distance</text>
  <text x="146" y="294" fill="#8b949e" font-size="11" text-anchor="middle">center-crop bbox region</text>
  <text x="146" y="310" fill="#8b949e" font-size="11" text-anchor="middle">IQR cluster → dist_cm, nc</text>

  <line x1="256" y1="290" x2="294" y2="290" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- EgoMotionCompensator -->
  <rect x="294" y="258" width="260" height="64" rx="6" fill="#2d1b00" stroke="#db6d28" stroke-width="1"/>
  <text x="424" y="276" fill="#f0883e" font-weight="bold" text-anchor="middle">EgoMotionCompensator</text>
  <text x="424" y="294" fill="#8b949e" font-size="11" text-anchor="middle">Shi-Tomasi + Lucas-Kanade</text>
  <text x="424" y="310" fill="#8b949e" font-size="11" text-anchor="middle">camera_z_velocity (cm/s)</text>

  <line x1="554" y1="290" x2="592" y2="290" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- update_distance -->
  <rect x="592" y="258" width="288" height="64" rx="6" fill="#271d00" stroke="#d29922" stroke-width="1"/>
  <text x="736" y="276" fill="#e3b341" font-weight="bold" text-anchor="middle">Track.update_distance()</text>
  <text x="736" y="294" fill="#8b949e" font-size="11" text-anchor="middle">raw_vel − camera_z_vel = true_vel</text>
  <text x="736" y="310" fill="#8b949e" font-size="11" text-anchor="middle">velocity_valid · TTC ready</text>

  <!-- depth frame feed arrow (from queue area down) -->
  <line x1="146" y1="216" x2="146" y2="256" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#wh)"/>

  <!-- ── THREAT ASSESSMENT ROW ── -->
  <text x="30" y="350" fill="#8b949e" font-size="11" letter-spacing="1">THREAT ASSESSMENT</text>

  <!-- IMU gate -->
  <rect x="36" y="358" width="200" height="64" rx="6" fill="#0a3040" stroke="#1f6feb" stroke-width="1"/>
  <text x="136" y="376" fill="#58a6ff" font-weight="bold" text-anchor="middle">MotionDetector (IMU)</text>
  <text x="136" y="394" fill="#8b949e" font-size="11" text-anchor="middle">ICM-20948 · 20-sample</text>
  <text x="136" y="410" fill="#8b949e" font-size="11" text-anchor="middle">gate: static objects suppressed</text>

  <line x1="236" y1="390" x2="274" y2="390" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- ThreatAssessment -->
  <rect x="274" y="358" width="240" height="64" rx="6" fill="#271d00" stroke="#d29922" stroke-width="1"/>
  <text x="394" y="374" fill="#e3b341" font-weight="bold" text-anchor="middle">ThreatAssessment</text>
  <text x="394" y="392" fill="#8b949e" font-size="11" text-anchor="middle">Layer 1: dist &lt;40cm → URGENT</text>
  <text x="394" y="408" fill="#8b949e" font-size="11" text-anchor="middle">Layer 2: TTC &lt;2s → URGENT</text>

  <line x1="514" y1="390" x2="552" y2="390" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- ThreatTransitionTracker -->
  <rect x="552" y="358" width="328" height="64" rx="6" fill="#2d1b00" stroke="#db6d28" stroke-width="1"/>
  <text x="716" y="376" fill="#f0883e" font-weight="bold" text-anchor="middle">ThreatTransitionTracker</text>
  <text x="716" y="394" fill="#8b949e" font-size="11" text-anchor="middle">watches state changes per track</text>
  <text x="716" y="410" fill="#8b949e" font-size="11" text-anchor="middle">"person moved away" · "path clear"</text>

  <!-- connect tracks down -->
  <line x1="750" y1="216" x2="750" y2="356" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#wh)"/>

  <!-- ── VOICE + LOG ROW ── -->
  <text x="30" y="450" fill="#8b949e" font-size="11" letter-spacing="1">OUTPUT</text>

  <!-- VoiceAssistant -->
  <rect x="36" y="458" width="280" height="80" rx="6" fill="#1a1160" stroke="#7c3aed" stroke-width="1"/>
  <text x="176" y="476" fill="#a78bfa" font-weight="bold" text-anchor="middle">VoiceAssistant</text>
  <text x="176" y="494" fill="#8b949e" font-size="11" text-anchor="middle">pending-queue · BT stream stays warm</text>
  <text x="176" y="511" fill="#6e7681" font-size="11" text-anchor="middle">URGENT 1.5s · WARNING 3s</text>
  <text x="176" y="526" fill="#6e7681" font-size="11" text-anchor="middle">AWARE 8s · CLEARED 4s</text>

  <line x1="176" y1="538" x2="176" y2="566" stroke="#484f58" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- Piper TTS -->
  <rect x="86" y="568" width="180" height="40" rx="6" fill="#0e4429" stroke="#26a641" stroke-width="1"/>
  <text x="176" y="585" fill="#3fb950" font-weight="bold" text-anchor="middle">PiperVoice → aplay</text>
  <text x="176" y="600" fill="#8b949e" font-size="11" text-anchor="middle">en_US-amy-medium.onnx</text>

  <!-- SceneDescriber -->
  <rect x="336" y="458" width="220" height="80" rx="6" fill="#0a3040" stroke="#1f6feb" stroke-width="1"/>
  <text x="446" y="476" fill="#58a6ff" font-weight="bold" text-anchor="middle">SceneDescriber</text>
  <text x="446" y="494" fill="#8b949e" font-size="11" text-anchor="middle">press d → Claude Vision API</text>
  <text x="446" y="511" fill="#8b949e" font-size="11" text-anchor="middle">spoken scene summary</text>
  <text x="446" y="526" fill="#6e7681" font-size="11" text-anchor="middle">cooldown 8s</text>

  <!-- CSV Logger -->
  <rect x="580" y="458" width="300" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="730" y="476" fill="#c9d1d9" font-weight="bold" text-anchor="middle">CSV Logger</text>
  <text x="730" y="494" fill="#8b949e" font-size="11" text-anchor="middle">~/blindnav_logs/log_YYYYMMDD.csv</text>
  <text x="730" y="511" fill="#6e7681" font-size="11" text-anchor="middle">fps · dist_cm · vel · tier</text>
  <text x="730" y="526" fill="#6e7681" font-size="11" text-anchor="middle">clusters · user_moving</text>

  <!-- connect threat -> voice -->
  <line x1="394" y1="422" x2="176" y2="456" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#wh)"/>
  <line x1="716" y1="422" x2="716" y2="440" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="716" y1="440" x2="446" y2="456" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#wh)"/>
  <line x1="716" y1="440" x2="730" y2="456" stroke="#484f58" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#wh)"/>

  <!-- arrowhead marker -->
  <defs>
    <marker id="wh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#484f58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
